python=/nfs/volume-100003-1/raochongzhi/envs/tf_a6000/bin/python
hadoop="/usr/local/hadoop-current/bin/hadoop"
hadoop_jar=/usr/local/hadoop-current/share/hadoop/tools/lib/hadoop-streaming-2.7.2-1906.jar
hadoopstreaming="${hadoop} jar ${hadoop_jar} -D stream.non.zero.exit.is.failure=false"
hadoop_queue="root.soda_i18n_trading_stg_prod"
hdfs_prefix="hdfs://DClusterUS1"

#fea path
hadoop_fea_root=/user/prod_soda_trade_strategy/rank/jiazhuo/hash_fea_new/train/
train_hdfs_dir="${hdfs_prefix}${hadoop_fea_root}"

#get current dir,to override manually, just set: proj_name=xxx
proj_name=$(basename "$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)")

#model path
hadoop_root=/user/prod_soda_trade_strategy/rank/hubohan/train_model_nb_br/${proj_name}/
hadoop_serving_model=$hadoop_root"/serving_model"

is_auto_train=1
need_test=0
need_dump_serving_model=1

# 训练过程中是否计算每天 eval 指标(AUC/GAUC/MAE)，0 跳过可大幅加速训练
enable_eval=0

#特征选择开关 —— Saliency Map 法
#
# Saliency Map 法:
#   saliency_select_stage=1 : 阶段一，训练时对 pooled embedding 求 ∂loss/∂emb 梯度范数，
#                             收敛后输出 log/fea_importance_saliency_<bday>_<eday>.txt
#   saliency_select_stage=2 : 阶段二，自动读取 saliency_importance_file 删掉
#                             saliency_prune_num 个最不重要 slot，用原始模型重训
#   saliency_select_stage=0 : 不使用 Saliency Map，正常训练
#   saliency_collect=1      : 开启梯度收集（阶段一必须设为1）
saliency_select_stage=0
saliency_collect=1
saliency_prune_num=100
#saliency_importance_file= : 阶段二指定读哪个文件；留空时按默认路径自动匹配
saliency_importance_file=./log/fea_importance_saliency_20260601_20260731.txt

#test_method= : 测试时用哪个特征选择方法评估（bn/senet/saliency）
#留空则不做特征剪枝，用完整特征集评估；阶段二完成后自动写入 saliency
test_method=saliency

#自定义 checkpoint 加载路径（可选）
#留空则从 model.done 读取；填写路径则优先使用该路径
#示例: custom_checkpoint_path=model/checkpoints/20260720
custom_checkpoint_path=

train_start_day=20260721
train_end_day=20260731
test_start_day=20260801
test_end_day=20260810

